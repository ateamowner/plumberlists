name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://plumberlists.com
      - name: Confirm static files
        run: |
          test -f out/CNAME
          test -f out/.nojekyll
          test -f out/googled3ae2edf58b5b2f8.html
          test -f out/501c87b49c5782ddc058aaea38764d39.txt
          test -d out/dayton-oh
          test -d out/dayton-oh/plumbing
          test "$(tr -d '[:space:]' < out/CNAME)" = "plumberlists.com"
          test "$(tr -d '\r' < out/googled3ae2edf58b5b2f8.html)" = "google-site-verification: googled3ae2edf58b5b2f8.html"
          test "$(tr -d '\r\n' < out/501c87b49c5782ddc058aaea38764d39.txt)" = "501c87b49c5782ddc058aaea38764d39"
          grep -F '<loc>https://plumberlists.com/</loc>' out/sitemap.xml
          grep -F '<loc>https://plumberlists.com/dayton-oh/plumbing/</loc>' out/sitemap.xml
          ! grep -E '<loc>https://plumberlists.com</loc>' out/sitemap.xml
          grep -F 'Sitemap: https://plumberlists.com/sitemap.xml' out/robots.txt
          ! grep -E 'Disallow:[[:space:]]*/($|for-pros|dayton-oh|featured|contact|quote)' out/robots.txt
          grep -F 'Page not found | PlumberLists' out/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - uses: actions/upload-artifact@v4
        with:
          name: indexnow-sitemap
          path: out/sitemap.xml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: indexnow-sitemap
          path: /tmp/indexnow
      - name: Ping IndexNow with sitemap locs
        run: python3 scripts/ping-indexnow.py --sitemap /tmp/indexnow/sitemap.xml
